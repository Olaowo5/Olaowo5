name: Update profile cards

on:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC
  workflow_dispatch: # run manually from the Actions tab

permissions:
  contents: write

# Never let the two profile workflows push at the same time
concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: GitHub stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&theme=synthwave
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=synthwave
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=catppuccin-macchiato&border_radius=20&mode=weekly&fire=6004EB&ring=6500EB&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "Update profile cards" || exit 0
          # Retry in case something else pushed to main at the same moment
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
